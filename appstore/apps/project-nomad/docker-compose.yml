# Project NOMAD, packaged as a Runtipi application.
#
# Derived from upstream install/management_compose.yaml
# (Crosstalk-Solutions/project-nomad @ v1.34.0) with four deliberate changes.
# Each is a contract with upstream behaviour; see lib/nomad.sh for the source
# references and docs/project-nomad.md for the reasoning.
#
#  1. container_name: nomad_admin is PINNED.
#     NOMAD locates its own container by that name to discover the host path
#     backing /app/storage, and rewrites every child container's bind mounts
#     onto it. Rename it and child apps get host paths that do not exist.
#
#  2. The `nomad-internal` network declares an explicit name:
#     project-nomad_default. That literal string is hardcoded in NOMAD's
#     DockerService and is the network it attaches every child container to.
#     Under Runtipi the compose project is named <app>_<store>, so without the
#     explicit name the network would be called something else and child
#     services would fail to attach.
#
#  3. The `updater` sidecar is REMOVED. It drives `docker compose ... up -d`
#     against /opt/project-nomad/compose.yml, which does not exist here, and
#     would contend with Runtipi for ownership of these containers.
#     Runtipi owns the core stack; NOMAD owns what NOMAD installs.
#
#  4. `dozzle` is REMOVED. It is a convenience log viewer that wants its own
#     Docker socket mount; Runtipi already provides per-app logs.
#
# Storage note: ${APP_DATA_DIR} is a HOST path (Runtipi sets it to
# <appDataPath>/app-data/<store>/<app>), so these binds are valid to the host
# Docker daemon that NOMAD talks to through the socket.

services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:v1.34.0
    container_name: nomad_admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/storage
      # Required: NOMAD creates and manages its child services through the
      # host Docker daemon. This grants it root-equivalent host control.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      # Host-side fallback for storage resolution. NOMAD normally derives this
      # by inspecting its own /app/storage bind; this value is used only if
      # that inspection fails, and must therefore be the HOST path.
      NOMAD_STORAGE_PATH: ${APP_DATA_DIR}/data/storage
      PORT: 8080
      LOG_LEVEL: info
      APP_KEY: ${NOMAD_APP_KEY}
      HOST: 0.0.0.0
      URL: http://${APP_LOCAL_DOMAIN}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nomad
      DB_NAME: nomad
      DB_USER: nomad_user
      DB_PASSWORD: ${NOMAD_DB_PASSWORD}
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISABLE_COMPRESSION: "false"
    networks:
      - nomad-internal
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    x-runtipi:
      is_main: true
      internal_port: 8080

  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOMAD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nomad
      MYSQL_USER: nomad_user
      MYSQL_PASSWORD: ${NOMAD_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    networks:
      - nomad-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    networks:
      - nomad-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reports host disk capacity to the NOMAD UI. Versioned independently of the
  # main NOMAD release (its newest tag is v1.31.1, not v1.34.0) — do not assume
  # the two version lines move together.
  disk-collector:
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:v1.31.1
    container_name: nomad_disk_collector
    restart: unless-stopped
    volumes:
      # Read-only view of the host filesystem for capacity reporting.
      - /:/host:ro,rslave
      - ${APP_DATA_DIR}/data/storage:/storage
    networks:
      - nomad-internal

networks:
  # The literal name is the contract. See note 2 above.
  nomad-internal:
    name: project-nomad_default

x-runtipi:
  schema_version: 2
