name: CI

on:
  push:
    branches: [production, main]
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          # -x follows `source` directives so lib/ helpers are resolved.
          # SC1091 is disabled because the sourced paths are resolved at
          # runtime from US_LIB_DIR, which shellcheck cannot evaluate.
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'Checking %d scripts\n' "${#files[@]}"
          shellcheck --external-sources --exclude=SC1091 --severity=warning "${files[@]}"

  syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' | sort)
          exit "$fail"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run helper tests
        run: ./tests/test-lib.sh

  config-example:
    name: Config example is loadable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load and validate the shipped example
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          cp config/server.env.example server.env
          # LAN_IP is intentionally blank in the example (auto-detected on a
          # real host); supply one so validation has something to check.
          sed -i 's/^LAN_IP=$/LAN_IP=192.168.8.10/' server.env
          export US_LIB_DIR="$PWD/lib" US_ROOT_DIR="$PWD"
          bash -c '
            source lib/config.sh
            us_config_load "$PWD/server.env"
            us_config_validate
            echo "LOCAL_DOMAIN=$LOCAL_DOMAIN"
            echo "DNS_SUBDOMAIN=$DNS_SUBDOMAIN"
          '

  installer-contract:
    name: Installer contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every declared stage exists and is executable
        run: |
          fail=0
          while IFS= read -r stage; do
            f="scripts/${stage}.sh"
            if [ -f "$f" ]; then
              echo "ok   $stage"
            else
              echo "FAIL $stage -> missing $f"
              fail=1
            fi
          done < <(./install.sh --list-stages)
          exit "$fail"

      - name: Entry points are executable
        run: |
          # Guards a failure mode that is invisible on Windows checkouts, where
          # core.filemode=false means a lost +x bit is never shown as a change.
          # Anything invoked as ./script must carry mode 100755 in the tree;
          # lib/ is sourced, not executed, and must NOT be executable.
          # git ls-files -s emits "<mode> <sha> <stage>\t<path>" — the path is
          # separated by a TAB, so the tab must be in IFS or path comes back empty.
          fail=0
          while IFS=$' \t' read -r mode _ _ path; do
            case "$path" in
              lib/*)
                if [ "$mode" = "100755" ]; then
                  echo "FAIL $path is executable but lib/ files are sourced, not run"
                  fail=1
                else
                  echo "ok   $path (non-executable, sourced)"
                fi
                ;;
              *)
                if [ "$mode" = "100755" ]; then
                  echo "ok   $path (executable)"
                else
                  echo "FAIL $path is $mode; needs 100755 (git update-index --chmod=+x '$path')"
                  fail=1
                fi
                ;;
            esac
          done < <(git ls-files -s -- '*.sh')
          exit "$fail"

      - name: --help works without root or configuration
        run: ./install.sh --help >/dev/null

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)server\.env$|secrets\.env|\.pem$|\.key$'; then
            echo "Refusing: credential-like files are tracked."
            exit 1
          fi
          echo "ok: no credential files tracked"
